<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Center Thermal Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="header">
      <h1 class="site-title">Data Center Thermal monitor</h1>
      <p class="sub">
        3 racks · 5 sensors each · next refresh in <span id="refresh-countdown" class="refresh-countdown">—</span>s
      </p>
      <p class="status" id="status-line">Connecting…</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Rack overview</h2>
        <div class="overview-analytics">
          <div id="overview-kpis" class="overview-kpis" aria-live="polite"></div>
          <div class="overview-pie-wrap">
            <h3>Rack status distribution</h3>
            <canvas id="overview-pie" width="360" height="180"></canvas>
          </div>
        </div>
        <div id="rack-grid" class="rack-grid" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2 id="charts-title">Overall analysis and rack details</h2>
        <div id="rack-insight" class="rack-insight"></div>
        <div id="alerts-panel" class="alerts-panel" aria-live="polite"></div>
        <div id="rack-details-list" class="rack-details-list" aria-live="polite"></div>
      </section>
    </main>

    <script type="application/json" id="app-config">
      {{ {"defaultRackId": rack_id, "rackIds": rack_ids, "pollIntervalMs": poll_interval_ms | int} | tojson }}
    </script>
    <div id="rack-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rack-modal-title">
      <div class="modal-backdrop" data-close-modal="1"></div>
      <section class="modal-content">
        <button type="button" id="rack-modal-close" class="modal-close" aria-label="Close">×</button>
        <h3 id="rack-modal-title">Rack details</h3>
        <p id="rack-modal-sub" class="modal-sub">Loading...</p>
        <div id="rack-modal-body" class="modal-body"></div>
      </section>
    </div>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
