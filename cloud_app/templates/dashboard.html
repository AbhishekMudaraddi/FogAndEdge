<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thermal monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="header">
      <h1>Fog-enabled data center thermal monitor</h1>
      <p class="sub">3 racks · 5 sensors each · refresh every {{ poll_interval_ms // 1000 }}s</p>
      <p class="status" id="status-line">Connecting…</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Rack overview</h2>
        <p class="hint">Click a rack card to focus graphs below.</p>
        <div id="rack-grid" class="rack-grid" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2 id="charts-title">Key trends</h2>
        <p class="hint">Detailed, scrollable charts and auto-generated interpretation for selected rack.</p>
        <div id="rack-insight" class="rack-insight"></div>
        <div id="alerts-panel" class="alerts-panel" aria-live="polite"></div>
        <div class="charts" id="charts-root"></div>
      </section>
    </main>

    <script>
      window.APP_CONFIG = {
        defaultRackId: {{ rack_id | tojson }},
        rackIds: {{ rack_ids | tojson }},
        pollIntervalMs: {{ poll_interval_ms | int }},
      };
    </script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
