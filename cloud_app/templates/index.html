<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Global Infrastructure View</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css"
      crossorigin=""
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
      }

      #globe {
        width: 100%;
        height: 100%;
      }

      .hint-overlay {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: rgba(12, 20, 35, 0.74);
        color: #e9efff;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
      }

      .region-panel {
        position: absolute;
        top: 78px;
        left: 16px;
        z-index: 1000;
        width: 280px;
        background: rgba(12, 20, 35, 0.28);
        color: #ffffff;
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(6px);
      }

      .region-panel h3 {
        margin: 0 0 8px 0;
        font-size: 15px;
        font-weight: 600;
      }

      .region-panel p {
        margin: 0 0 10px 0;
        font-size: 12px;
        color: #d5e2ff;
      }

      .region-panel select,
      .region-panel button {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
      }

      .region-panel select {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        margin-bottom: 10px;
      }

      .region-panel button {
        background: #3ea6ff;
        color: #081321;
        font-weight: 700;
        cursor: pointer;
      }

      .region-panel button:hover {
        background: #71beff;
      }

      .region-panel .back-btn {
        margin-top: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: #e7efff;
        font-weight: 600;
      }

      .region-panel .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .dashboard-modal {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: none;
      }

      .dashboard-modal.show {
        display: block;
      }

      .dashboard-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.58);
      }

      .dashboard-modal-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(1200px, 92vw);
        height: min(760px, 90vh);
        background: #0b1220;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .dashboard-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        background: rgba(10, 17, 30, 0.95);
        color: #e9efff;
        font-size: 14px;
      }

      .dashboard-modal-close {
        border: 0;
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }

      .dashboard-frame {
        width: 100%;
        height: calc(100% - 48px);
        border: 0;
        background: #0d1322;
      }
    </style>
  </head>
  <body>
    <div class="hint-overlay">Drag to rotate · Scroll to zoom · Click region marker to open dashboard</div>
    <aside class="region-panel" aria-label="Region controls">
      <h3>Select availability zone region</h3>
      <select id="region-select"></select>
      <button type="button" id="open-region">Open selected dashboard</button>
      <button type="button" id="back-home" class="back-btn">Back</button>
    </aside>
    <div id="globe" aria-label="Global infrastructure globe"></div>
    <section id="dashboard-modal" class="dashboard-modal" aria-hidden="true">
      <div class="dashboard-modal-backdrop" data-close="1"></div>
      <article class="dashboard-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="dashboard-modal-header">
          <strong id="modal-title">Regional Dashboard</strong>
          <button id="modal-close" class="dashboard-modal-close" type="button">Close</button>
        </header>
        <iframe id="dashboard-frame" class="dashboard-frame" title="Regional Dashboard"></iframe>
      </article>
    </section>

    <script id="map-config" type="application/json">
      {{ {"center": map_center, "zoom": map_zoom, "regions": regions, "dashboardRegions": dashboard_regions} | tojson }}
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js"
      crossorigin=""
    ></script>
    <script>
      function readConfig() {
        const el = document.getElementById("map-config");
        if (!el || !el.textContent) return null;
        try {
          return JSON.parse(el.textContent.trim());
        } catch (_) {
          return null;
        }
      }

      const cfg = readConfig() || {
        center: { lat: 53.3498, lon: -6.2603 },
        zoom: 3,
        regions: [],
        dashboardRegions: [],
      };

      const viewer = new Cesium.Viewer("globe", {
        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        sceneModePicker: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
      });
      const CAMERA_RANGE = 9000000;
      const FOCUS_RANGE = 5200000;
      const HOME_CENTER = { lon: cfg.center.lon, lat: cfg.center.lat };
      const ROTATE_SPEED = 0.0008;
      const INTERACTION_PAUSE_MS = 5000;
      const controller = viewer.scene.screenSpaceCameraController;
      controller.minimumZoomDistance = CAMERA_RANGE;
      controller.maximumZoomDistance = CAMERA_RANGE;
      controller.enableZoom = false;
      controller.enableTranslate = false;
      controller.enableTilt = false;

      async function applyBaseImagery() {
        viewer.imageryLayers.removeAll();
        try {
          // Primary: satellite-like real Earth imagery.
          const arcgis = await Cesium.ArcGisMapServerImageryProvider.fromUrl(
            "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
          );
          viewer.imageryLayers.addImageryProvider(arcgis);
          return;
        } catch (_) {
          // Fallback 1: OpenStreetMap tiles.
        }

        try {
          const osm = new Cesium.OpenStreetMapImageryProvider({
            url: "https://tile.openstreetmap.org/",
          });
          viewer.imageryLayers.addImageryProvider(osm);
          return;
        } catch (_) {
          // Fallback 2: Cesium bundled NaturalEarth texture.
        }

        const naturalEarth = await Cesium.TileMapServiceImageryProvider.fromUrl(
          Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII")
        );
        viewer.imageryLayers.addImageryProvider(naturalEarth);
      }

      applyBaseImagery();

      viewer.scene.globe.enableLighting = true;
      function flyToCoordinates(lon, lat, durationSec, range) {
        viewer.camera.flyToBoundingSphere(
          new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(lon, lat), 1000),
          {
            duration: durationSec || 1.6,
            offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-28), range || CAMERA_RANGE),
          }
        );
      }

      flyToCoordinates(cfg.center.lon, cfg.center.lat, 1.6, CAMERA_RANGE);

      const regions = Array.isArray(cfg.regions) ? cfg.regions : [];
      const dashboardRegionSet = new Set(Array.isArray(cfg.dashboardRegions) ? cfg.dashboardRegions : []);
      const regionByCode = {};
      const entityByCode = {};
      let focusedRegionCode = null;
      let autoRotateEnabled = true;
      let pauseAutoRotateUntilMs = 0;
      regions.forEach((region) => {
        regionByCode[region.code] = region;
        const entity = viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(region.lon, region.lat),
          point: {
            pixelSize: 10,
            color: Cesium.Color.fromCssColorString("#3ea6ff"),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          },
          label: {
            text: `${region.code}\n${region.name}`,
            font: "13px Arial",
            fillColor: Cesium.Color.WHITE,
            showBackground: true,
            backgroundColor: Cesium.Color.fromCssColorString("rgba(12,20,35,0.75)"),
            pixelOffset: new Cesium.Cartesian2(0, -30),
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          },
          properties: {
            regionCode: region.code,
            dashboardEnabled: dashboardRegionSet.has(region.code),
          },
          description: `${region.name}`,
        });
        entityByCode[region.code] = entity;
      });

      const select = document.getElementById("region-select");
      const openBtn = document.getElementById("open-region");
      const backBtn = document.getElementById("back-home");
      const modal = document.getElementById("dashboard-modal");
      const modalClose = document.getElementById("modal-close");
      const modalTitle = document.getElementById("modal-title");
      const modalFrame = document.getElementById("dashboard-frame");
      if (select) {
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select zone";
        placeholder.disabled = true;
        placeholder.selected = true;
        select.appendChild(placeholder);

        regions.filter((region) => dashboardRegionSet.has(region.code)).forEach((region) => {
          const opt = document.createElement("option");
          opt.value = region.code;
          opt.textContent = `${region.code} (${region.name})`;
          select.appendChild(opt);
        });
      }

      function highlightRegion(code) {
        Object.keys(entityByCode).forEach((k) => {
          const e = entityByCode[k];
          if (!e || !e.point) return;
          const active = k === code;
          e.point.pixelSize = active ? 14 : 10;
          e.point.color = active
            ? Cesium.Color.fromCssColorString("#ffd166")
            : Cesium.Color.fromCssColorString("#3ea6ff");
        });
      }

      function flyToRegion(code) {
        const region = regionByCode[code];
        if (!region) return;
        flyToCoordinates(region.lon, region.lat, 1.2, FOCUS_RANGE);
        highlightRegion(code);
      }

      function openDashboardModal(code) {
        const region = regionByCode[code];
        if (!region || !modal || !modalFrame || !modalTitle) return;
        modalTitle.textContent = `Regional Dashboard - ${region.code} (${region.name})`;
        modalFrame.src = `/az/${encodeURIComponent(region.code)}`;
        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeDashboardModal() {
        if (!modal || !modalFrame) return;
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
        modalFrame.src = "";
      }

      function pauseAutoRotate() {
        if (!autoRotateEnabled) return;
        pauseAutoRotateUntilMs = Date.now() + INTERACTION_PAUSE_MS;
      }

      function resumeHomeRotation() {
        focusedRegionCode = null;
        autoRotateEnabled = true;
        pauseAutoRotateUntilMs = Date.now();
        highlightRegion("");
        flyToCoordinates(HOME_CENTER.lon, HOME_CENTER.lat, 1.1, CAMERA_RANGE);
      }

      if (select) {
        select.addEventListener("change", () => {
          const code = select.value;
          if (!code) return;
          focusedRegionCode = code;
          autoRotateEnabled = false;
          flyToRegion(code);
        });
      }

      if (openBtn) {
        openBtn.addEventListener("click", () => {
          const code = select ? select.value : "";
          if (!code) return;
          openDashboardModal(code);
        });
      }

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          if (select) {
            select.value = "";
          }
          resumeHomeRotation();
        });
      }

      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      handler.setInputAction((movement) => {
        const picked = viewer.scene.pick(movement.position);
        if (!picked || !picked.id || !picked.id.properties) return;
        const code = picked.id.properties.regionCode && picked.id.properties.regionCode.getValue();
        if (!code) return;
        if (select && dashboardRegionSet.has(code)) select.value = code;
        flyToRegion(code);
        const enabled =
          picked.id.properties.dashboardEnabled &&
          Boolean(picked.id.properties.dashboardEnabled.getValue());
        if (enabled) {
          openDashboardModal(code);
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      handler.setInputAction(() => {
        pauseAutoRotate();
      }, Cesium.ScreenSpaceEventType.LEFT_DOWN);
      handler.setInputAction(() => {
        pauseAutoRotate();
      }, Cesium.ScreenSpaceEventType.WHEEL);
      handler.setInputAction(() => {
        pauseAutoRotate();
      }, Cesium.ScreenSpaceEventType.PINCH_START);

      viewer.clock.onTick.addEventListener(() => {
        if (!autoRotateEnabled || focusedRegionCode) return;
        if (Date.now() < pauseAutoRotateUntilMs) return;
        viewer.scene.camera.rotateRight(ROTATE_SPEED);
      });

      if (modal) {
        modal.addEventListener("click", (evt) => {
          const target = evt.target;
          if (!(target instanceof HTMLElement)) return;
          if (target.dataset.close === "1") {
            closeDashboardModal();
          }
        });
      }

      if (modalClose) {
        modalClose.addEventListener("click", () => closeDashboardModal());
      }

      document.addEventListener("keydown", (evt) => {
        if (evt.key === "Escape") closeDashboardModal();
      });
    </script>
  </body>
</html>
